<!doctype html><html lang="he" dir="rtl" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="דירות למכירה בדישראלי 14, חיפה - בניין חדש בן 12 דירות, בסמוך למרכז חורב">
<title>דירות למכירה</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2a2e;--mu:#6b777b;--ac:#1f6f5c;--bd:#e5e3dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--card:#1d2527;--tx:#eef2f1;--mu:#98a5a8;--ac:#4cb89f;--bd:#2c3739;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191a;--card:#1d2527;--tx:#eef2f1;--mu:#98a5a8;--ac:#4cb89f;--bd:#2c3739;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
h1{font-size:28px;margin:0 0 4px}h2{font-size:20px;margin:0}h3{margin:0 0 12px}
.hd{padding:28px 16px 12px}.hd p{margin:0 0 14px;color:var(--mu)}
.pill{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:4px 14px;font-size:14px;margin-inline-end:6px}
.pill.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.g{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 16px}
.g>*{flex:0 0 88%;scroll-snap-align:center;border-radius:16px;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.ph{background:var(--bd);display:grid;place-items:center;color:var(--mu);font-size:14px;aspect-ratio:16/10;width:100%}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:0 16px 16px}
.im{position:relative}.im img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;display:block;cursor:zoom-in}.g>img:only-child{flex-basis:100%}.lb{background:var(--card);height:100dvh;overflow:auto;padding:8px;box-sizing:border-box}.lb img{width:230%;max-width:none;display:block;background:#fff}.lb button{position:sticky;top:0;inset-inline-start:0;width:auto;padding:8px 18px;margin-bottom:8px;z-index:1}.m select{display:block;width:100%;font:inherit;font-size:16px;padding:10px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}.lab{font-size:13px;color:var(--ac);font-weight:600;margin-inline-start:6px}
.sold .im img,.sold .ph{filter:grayscale(1);opacity:.55}
.bg2{position:absolute;top:12px;inset-inline-start:12px;background:#c0392b;color:#fff;padding:2px 14px;border-radius:99px;font-size:14px}
.in{padding:14px 16px 16px}.t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.p{font-weight:700;color:var(--ac);font-size:18px}.sold .p{color:var(--mu);text-decoration:line-through}
.sp{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sp span{background:var(--bg);border-radius:8px;padding:3px 10px;font-size:14px}
.ex{margin:0 0 12px;color:var(--mu);font-size:14px}
a.wa,button{display:block;text-align:center;text-decoration:none;font:inherit;font-size:16px;background:#1f9d55;color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer;width:100%;box-sizing:border-box}
button.gh,.ed{background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.ob{background:var(--ac);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center}
.ob button{width:auto;padding:8px 14px;margin:0;font-size:14px;background:#fff;color:#1d2a2e;border:0}
.ft{text-align:center;color:var(--mu);font-size:13px;padding:8px 16px 28px}
#ov{position:fixed;inset:0;background:#0007;display:grid;align-items:end;z-index:9}#ov[hidden]{display:none}
.m{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.m label{display:block;font-size:14px;color:var(--mu);margin-bottom:10px}
.m input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.bt{display:flex;gap:8px;margin-top:8px}.bt button{margin:0}
.ab{margin:0 16px 20px}.ab p{margin:0 0 12px;color:var(--mu)}.ab ul{margin:0 0 12px;padding-inline-start:20px;color:var(--mu)}.wz{display:block;text-align:center;text-decoration:none;color:var(--ac);border:1px solid var(--ac);border-radius:12px;padding:10px;margin:14px 0 22px}.m textarea{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.sd{border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:10px;padding:0 14px}.sd summary{padding:14px 0;font-weight:600;cursor:pointer}.sd h4{margin:14px 0 4px;color:var(--ac)}.sd ul{margin:0 0 12px;padding-inline-start:20px;color:var(--mu)}.sd li{margin-bottom:5px}
.g img{cursor:zoom-in}.lv{background:#000;height:100dvh;display:flex;flex-direction:column}.lt{display:flex;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px}.lt button{width:auto;margin:0;padding:8px 18px;background:#333;color:#fff;border:0}.lt #cz{margin-inline-start:auto}.ls{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-x pan-y pinch-zoom}.ls img{width:100%;max-width:none;max-height:100%;object-fit:contain;margin:auto;flex:none;cursor:zoom-in}
.nv{display:flex;gap:8px;margin:14px 0 22px}.nv .wz{flex:1;margin:0;padding:10px 6px;font-size:15px}.sd{padding:0;border:1px solid #1f6f5c;overflow:hidden}.sd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;background:#1f6f5c;color:#fff;padding:15px 16px;font-size:17px;font-weight:700}.sd summary::-webkit-details-marker{display:none}.sd summary::after{content:"לחצו לפתיחה ▾";font-size:13px;font-weight:400}.sd[open] summary::after{content:"סגירה ▴"}.sd h4,.sd ul{margin-inline:14px}.sd ul{padding-inline-start:20px}
.ch{display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:15px}.ch b{font-size:20px;color:var(--ac)}.ch span{color:var(--tx)}.ch span+span::before{content:"·";margin-inline-end:10px;color:var(--mu)}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" hidden=""></div>
<script src="data.js"></script>
<script>
const S=window.SITE;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let owner=false,dirty=false;
const F=[['num','מספר דירה'],['floor','קומה'],['dir','כיווני אוויר'],['price','מחיר (מספר בלבד)'],['extras','הערות (חניה, מחסן…)']];
const wa=a=>`https://wa.me/${S.wa}?text=`+encodeURIComponent(a?`היי, מעוניין בדירה ${a.num} בקומה ${a.floor} ב${S.name}`:`היי, אשמח לפרטים על הדירות ב${S.name}`);
function render(){
  const left=S.apts.filter(a=>!a.sold).length;
  const g=(S.imgs.length?S.imgs:[0]).map(s=>s?`<img class="zm" src="${s}" alt="הדמיית הבניין">`:'<div class="ph">הדמיית הבניין תתווסף כאן</div>').join('');
  const cards=S.apts.map((a,i)=>{const t=S.types[a.t]||{},im=a.img||t.img;return `<article class="c${a.sold?' sold':''}"><div class="ch"><b>דירה ${esc(a.num)}</b>${a.floor?`<span>קומה ${esc(a.floor)}</span>`:''}<span>כ-${esc(t.size)} מ״ר</span></div><div class="im">${im?`<img class="zm" src="${im}" alt="תוכנית דירה ${esc(a.num)}">`:'<div class="ph">הדמיית הדירה תתווסף כאן</div>'}${a.sold?'<b class="bg2">נמכרה</b>':''}</div><div class="in"><div class="t"><h2>${esc(t.rooms)} חדרים${t.label?` · ${esc(t.label)}`:''}</h2><span class="p">${a.price?Number(a.price).toLocaleString('he-IL')+' ₪<small style="display:block;font-size:11px;font-weight:400;color:var(--mu);text-align:end">כולל מע״מ</small>':'צרו קשר למחיר'}</span></div><div class="sp"><span>מרפסת כ-${esc(t.bal)} מ״ר</span><span>חניה פרטית רגילה</span><span>מחסן</span>${a.dir?`<span>כיווני אוויר: ${esc(a.dir)}</span>`:''}</div>${a.extras?`<p class="ex">${esc(a.extras)}</p>`:''}${a.sold?'':`<a class="wa" href="${wa(a)}">שלחו הודעה בוואטסאפ</a>`}${owner?`<button class="ed" data-i="${i}">עריכת הדירה</button>`:''}</div></article>`}).join('');
  const sh=s=>{let o='',u=0;String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(x.startsWith('## ')){if(u)o+='</ul>';u=0;o+=`<h4>${esc(x.slice(3))}</h4>`}else{if(!u){o+='<ul>';u=1}o+=`<li>${esc(x)}</li>`}});return o+(u?'</ul>':'')};const spd=(t,s)=>s&&s.trim()?`<details class="sd"><summary>${t}</summary>${sh(s)}</details>`:'';const info=`<section class="ab"><h3>על הפרויקט</h3><div class="g" style="padding:0 0 12px">${g}</div><p>${esc(S.about)}</p>${(S.specB||S.specA)?`<h3>מפרט טכני</h3>${spd('מפרט הבניין',S.specB)}${spd('מפרט הדירות',S.specA)}`:''}<div class="nv"><a class="wz" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(S.addr)}">ניווט ב-Google Maps</a><a class="wz" href="https://waze.com/ul?q=${encodeURIComponent(S.addr)}">ניווט ב-Waze</a></div><h3>דירות למכירה</h3></section>`;
  $('#app').innerHTML=(owner?`<div class="ob"><span>מצב בעלים</span><button id="eb">עריכת הבניין</button>${dirty?'<button id="pb">פרסום שינויים</button>':''}</div>`:'')+
  `<header class="hd"><h1>${esc(S.name)}</h1><p>${esc(S.sub)}</p>${S.pills?`<span class="pill">${left} דירות פנויות</span>${S.apts.length-left?`<span class="pill o">${S.apts.length-left} נמכרו</span>`:''}`:''}</header>${info}${cards}<div class="in" style="padding-top:0"><a class="wa" href="${wa()}">דברו איתנו בוואטסאפ</a><a class="wa sh" style="margin-top:10px;background:none;color:#1f9d55;border:1px solid #1f9d55" href="https://wa.me/?text=${encodeURIComponent(S.name+' – דירות למכירה')}%0A${encodeURIComponent(S.link||location.href)}">שתפו את הדף בוואטסאפ</a></div><p class="ft">לפרטים: <a href="tel:+${S.wa}">0${S.wa.slice(3)}</a><br>ההדמיות להמחשה בלבד. המחירים והפרטים כפופים לשינויים.</p>`;
}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(f)}
function modal(h,save){const o=$('#ov');o.innerHTML=`<div class="m">${h}<div class="bt"><button id="ok">שמירה</button><button id="no" class="gh">ביטול</button></div></div>`;o.hidden=false;$('#no').onclick=()=>o.hidden=true;$('#ok').onclick=()=>{save();o.hidden=true;dirty=true;render()}}
function editA(i){const a=S.apts[i];let img=a.img;
  modal(`<h3>דירה ${esc(a.num)}</h3>`+F.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${esc(a[k])}"></label>`).join('')+`<label>סוג דירה<select data-k="t">${Object.keys(S.types).map(k=>`<option value="${k}"${a.t===k?' selected':''}>${k} · ${S.types[k].rooms} חדרים</option>`).join('')}</select></label><label><input type="checkbox" id="sd" ${a.sold?'checked':''}> הדירה נמכרה</label><label>תמונה ייעודית לדירה (לא חובה)<input type="file" accept="image/*" id="fi"></label>`,
  ()=>{document.querySelectorAll('#ov [data-k]').forEach(e=>a[e.dataset.k]=e.value.trim());a.price=a.price.replace(/\D/g,'');a.sold=$('#sd').checked;a.img=img});
  $('#fi').onchange=e=>e.target.files[0]&&shrink(e.target.files[0],d=>img=d)}
function editB(){let add=[];
  modal(`<h3>פרטי הבניין</h3><label>שם הפרויקט<input data-k="name" value="${esc(S.name)}"></label><label>כותרת משנה<input data-k="sub" value="${esc(S.sub)}"></label><label>כתובת (לניווט)<input data-k="addr" value="${esc(S.addr)}"></label><label>תיאור הפרויקט<textarea data-k="about" rows="4">${esc(S.about)}</textarea></label><label>מפרט הבניין (שורה לכל פריט, כותרת משנה בשורה שמתחילה ב-## )<textarea data-k="specB" rows="6">${esc(S.specB)}</textarea></label><label>מפרט הדירות (שורה לכל פריט, כותרת משנה בשורה שמתחילה ב-## )<textarea data-k="specA" rows="8">${esc(S.specA)}</textarea></label><label><input type="checkbox" id="pl" ${S.pills?'checked':''}> הצגת באנר "דירות פנויות" בראש הדף</label><label>קישור לשיתוף (הקישור הציבורי של הדף)<input data-k="link" value="${esc(S.link||'')}"></label><label>מספר וואטסאפ (בפורמט 9725XXXXXXXX)<input data-k="wa" value="${esc(S.wa)}"></label><label>הוספת הדמיות (עד 4)<input type="file" accept="image/*" multiple id="fi"></label><label><input type="checkbox" id="cl"> מחיקת ההדמיות הקיימות (${S.imgs.length})</label>`,
  ()=>{document.querySelectorAll('#ov [data-k]').forEach(e=>S[e.dataset.k]=e.value.trim());S.wa=S.wa.replace(/\D/g,'');S.pills=$('#pl').checked;if($('#cl').checked)S.imgs=[];S.imgs=S.imgs.concat(add).slice(0,4)});
  $('#fi').onchange=e=>{add=[];[...e.target.files].slice(0,4).forEach(f=>shrink(f,d=>add.push(d)))}}
async function pub(){
  try{const a=await claude.use('artifact');const d=document.documentElement.cloneNode(true);
  d.querySelector('#app').innerHTML='';const o=d.querySelector('#ov');o.innerHTML='';o.hidden=true;
  d.querySelector('#st').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  await a.publish('<!doctype html>'+d.outerHTML)}catch(e){alert('הפרסום נכשל, נסו שוב')}}
document.addEventListener('click',e=>{const t=e.target;
  if(t.classList.contains('ed'))editA(+t.dataset.i);else if(t.classList.contains('zm')){const o=$('#ov');let z=1;o.innerHTML=`<div class="lv"><div class="lt"><button id="zi">＋</button><button id="zo">－</button><button id="cz">סגירה</button></div><div class="ls"><img id="zimg" src="${t.src}"></div></div>`;o.hidden=false;const im=$('#zimg'),ap=()=>{im.style.width=(z*100)+'%';im.style.maxHeight=z>1?'none':'100%'};$('#zi').onclick=()=>{z=Math.min(4,z+.75);ap()};$('#zo').onclick=()=>{z=Math.max(1,z-.75);ap()};im.onclick=()=>{z=z>1?1:2.5;ap()};$('#cz').onclick=()=>o.hidden=true}else if(t.id==='eb')editB();else if(t.id==='pb')pub()});
render();

</script>


</body></html>
