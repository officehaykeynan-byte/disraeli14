<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="דירות למכירה בדישראלי 14, חיפה - בניין חדש בן 12 דירות, בסמוך למרכז חורב">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="דישראלי 14 חיפה | דירות למכירה">
<meta property="og:description" content="7 דירות למכירה בבניין חדש של 12 דירות, בסמוך למרכז חורב. 3 עד 6 חדרים, חניה פרטית ומחסן.">
<meta property="og:url" content="https://disraeli14.netlify.app/">
<meta property="og:image" content="https://disraeli14.netlify.app/images/og.jpg">

<title>דישראלי 14 חיפה | דירות למכירה</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="ov" hidden=""></div>
<script src="data.js"></script>
<script>
const S=window.SITE;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let owner=false,dirty=false;
const F=[['num','מספר דירה'],['floor','קומה'],['dir','כיווני אוויר'],['price','מחיר (מספר בלבד)'],['extras','הערות (חניה, מחסן…)']];
const wa=a=>`https://wa.me/${S.wa}?text=`+encodeURIComponent(a?`היי, מעוניין בדירה ${a.num} בקומה ${a.floor} ב${S.name}`:`היי, אשמח לפרטים על הדירות ב${S.name}`);
function render(){
  const left=S.apts.filter(a=>!a.sold).length;
  const g=(S.imgs.length?S.imgs:[0]).map(s=>s?`<img class="zm" src="${s}" alt="הדמיית הבניין">`:'<div class="ph">הדמיית הבניין תתווסף כאן</div>').join('');
  const chips=Object.keys(S.types).filter(k=>S.apts.some(a=>a.t===k)).map(k=>{const t=S.types[k],tot=S.apts.filter(a=>a.t===k).length,n=S.apts.filter(a=>a.t===k&&!a.sold).length,sb=S.showStatus?`${n} ${n===1?'פנויה':'פנויות'}`:(tot===1?'דירה אחת':`${tot} דירות`);return `<a class="chip" href="#g-${k}">${t.label?`${esc(t.label)} - ${esc(t.rooms)} חדרים`:`${esc(t.rooms)} חדרים`}<b>${sb}</b></a>`}).join('');
  const lastc=S.showStatus||S.apts.some(a=>a.price);
  const cards=Object.keys(S.types).map(k=>{const t=S.types[k],L=S.apts.map((a,i)=>[a,i]).filter(([a])=>a.t===k);if(!L.length)return '';
    const title=t.label?`${esc(t.label)} - ${esc(t.rooms)} חדרים`:`דירות ${esc(t.rooms)} חדרים`;
    const rows=L.map(([a,i])=>`<tr class="${S.showStatus&&a.sold?'sold':''}"><td class="n">${esc(a.num)}</td><td>${a.floor?esc(a.floor):'–'}</td><td class="dr">${esc(a.dir||'')}${a.extras?`<small>${esc(a.extras)}</small>`:''}${a.img?`<button class="zm gv2" data-src="${a.img}">תמונת הדירה</button>`:''}${owner?`<button class="ed" data-i="${i}">עריכה</button>`:''}</td>${lastc?`<td>${S.showStatus?(a.sold?'<em class="st s0">נמכרה</em>':'<em class="st s1">פנויה</em>'):''}${a.price?`<b class="pz">${Number(a.price).toLocaleString('he-IL')} ₪</b>`:''}</td>`:''}</tr>`).join('');
    return `<section class="gp" id="g-${k}"><div class="gh"><h2>${title}</h2><p>כ-${esc(t.size)} מ״ר · מרפסת כ-${esc(t.bal)} מ״ר · חניה פרטית רגילה ומחסן</p>${t.img?`<button class="zm gv" data-src="${t.img}">הדמיית הדירה</button>`:''}</div><table class="at2"><thead><tr><th>דירה</th><th>קומה</th><th>כיווני אוויר</th>${lastc?`<th>${S.showStatus?'סטטוס':'מחיר'}</th>`:''}</tr></thead><tbody>${rows}</tbody></table></section>`}).join('');
  const vid=S.video?`<div class="vs"><h3>הכירו את הבניין</h3><p class="vsub">מבט מהרחוב אל דישראלי 14, בסמוך למרכז חורב.</p><div class="vd"><video id="vv" src="${S.video.src}" poster="${S.video.poster}" preload="none" playsinline></video><button class="vp" id="vp" aria-label="הפעלת הסרטון"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i><span>צפו בסרטון · 7 שניות</span></button></div><p class="vnote">הדמיית וידאו, להמחשה בלבד.</p></div>`:'';const tel='0'+String(S.wa).slice(3);const bn=`<div class="sb"><div class="sbr"><span class="sbt">לפרטים נוספים חייגו <b dir="ltr">${tel.slice(0,3)}-${tel.slice(3)}</b></span><div class="sbb"><a class="sbc sbw" href="${wa()}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.95L2 22l5.2-1.5A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 1 1-4.3 14.95l-.3-.2-3 .87.9-2.92-.2-.3A8.1 8.1 0 0 1 12.04 3.8zm-3.1 3.9c-.2 0-.5.07-.75.35-.25.28-.97.95-.97 2.3s1 2.7 1.1 2.88c.14.18 1.95 3.1 4.8 4.2 2.37.93 2.85.75 3.37.7.52-.05 1.67-.68 1.9-1.34.24-.66.24-1.22.17-1.34-.07-.12-.26-.19-.54-.33-.28-.14-1.67-.82-1.93-.92-.26-.1-.45-.14-.64.14-.19.28-.73.92-.9 1.1-.16.2-.33.21-.6.07-.28-.14-1.2-.44-2.28-1.4-.84-.75-1.4-1.68-1.57-1.96-.16-.28-.02-.43.12-.57.13-.13.28-.33.42-.5.14-.16.19-.28.28-.47.1-.19.05-.35-.02-.5-.07-.14-.64-1.55-.88-2.12-.23-.55-.47-.48-.64-.49z"/></svg>וואטסאפ</a><a class="sbc call" href="tel:${tel}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>חייגו</a></div></div><div class="sbn">חי קינן יזום ובניה בע״מ</div></div>`;const ab=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('## ')?`<h4 class="ah">${esc(x.slice(3))}</h4>`:`<p>${esc(x)}</p>`).join('');const sh=s=>{let o='',u=0;String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(x.startsWith('## ')){if(u)o+='</ul>';u=0;o+=`<h4>${esc(x.slice(3))}</h4>`}else{if(!u){o+='<ul>';u=1}o+=`<li>${esc(x)}</li>`}});return o+(u?'</ul>':'')};const spd=(t,s)=>s&&s.trim()?`<details class="sd"><summary>${t}</summary>${sh(s)}</details>`:'';const info=`<section class="ab"><h3>על הפרויקט</h3><div class="g" style="padding:0 0 12px">${g}</div>${ab(S.about)}${(S.specB||S.specA)?`<h3>מפרט טכני</h3>${spd('מפרט הבניין',S.specB)}${spd('מפרט הדירות',S.specA)}`:''}<div class="nv"><a class="wz" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(S.addr)}">ניווט ב-Google Maps</a><a class="wz" href="https://waze.com/ul?q=${encodeURIComponent(S.addr)}">ניווט ב-Waze</a></div>${vid}<h3>דירות למכירה</h3><p class="vsub">בחרו סוג דירה כדי לראות את הדירות, הקומות וההדמיה</p><div class="chips">${chips}</div>${S.apts.some(a=>a.price)?'<p class="vn">המחירים כוללים מע״מ</p>':''}</section>`;
  $('#app').innerHTML=(owner?`<div class="ob"><span>מצב בעלים</span><button id="eb">עריכת הבניין</button>${dirty?'<button id="pb">פרסום שינויים</button>':''}</div>`:'')+
  `<div class="top">חי קינן יזום ובניה בע״מ</div><header class="hd"><h1>${esc(S.name)}</h1><p>${esc(S.sub)}</p>${S.pills?`<span class="pill">${left} דירות פנויות</span>${S.apts.length-left?`<span class="pill o">${S.apts.length-left} נמכרו</span>`:''}`:''}</header>${info}${cards}<div class="in" style="padding-top:0"><a class="wa" href="${wa()}">דברו איתנו בוואטסאפ</a><a class="wa sh" style="margin-top:10px;background:none;color:#1f9d55;border:1px solid #1f9d55" href="https://wa.me/?text=${encodeURIComponent(S.name+' – דירות למכירה')}%0A${encodeURIComponent(S.link||location.href)}">שתפו את הדף בוואטסאפ</a></div><p class="ft">לפרטים: <a href="tel:+${S.wa}">0${S.wa.slice(3)}</a><br>ההדמיות להמחשה בלבד. המחירים והפרטים כפופים לשינויים.</p>${bn}`;
}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(f)}
function modal(h,save){const o=$('#ov');o.innerHTML=`<div class="m">${h}<div class="bt"><button id="ok">שמירה</button><button id="no" class="gh">ביטול</button></div></div>`;o.hidden=false;$('#no').onclick=()=>o.hidden=true;$('#ok').onclick=()=>{save();o.hidden=true;dirty=true;render()}}
function editA(i){const a=S.apts[i];let img=a.img;
  modal(`<h3>דירה ${esc(a.num)}</h3>`+F.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${esc(a[k])}"></label>`).join('')+`<label>סוג דירה<select data-k="t">${Object.keys(S.types).map(k=>`<option value="${k}"${a.t===k?' selected':''}>${k} · ${S.types[k].rooms} חדרים</option>`).join('')}</select></label><label><input type="checkbox" id="sd" ${a.sold?'checked':''}> הדירה נמכרה</label><label>תמונה ייעודית לדירה (לא חובה)<input type="file" accept="image/*" id="fi"></label>`,
  ()=>{document.querySelectorAll('#ov [data-k]').forEach(e=>a[e.dataset.k]=e.value.trim());a.price=a.price.replace(/\D/g,'');a.sold=$('#sd').checked;a.img=img});
  $('#fi').onchange=e=>e.target.files[0]&&shrink(e.target.files[0],d=>img=d)}
function editB(){let add=[];
  modal(`<h3>פרטי הבניין</h3><label>שם הפרויקט<input data-k="name" value="${esc(S.name)}"></label><label>כותרת משנה<input data-k="sub" value="${esc(S.sub)}"></label><label>כתובת (לניווט)<input data-k="addr" value="${esc(S.addr)}"></label><label>תיאור הפרויקט (שורה חדשה = פסקה חדשה, ## בתחילת שורה = כותרת)<textarea data-k="about" rows="4">${esc(S.about)}</textarea></label><label>מפרט הבניין (שורה לכל פריט, כותרת משנה בשורה שמתחילה ב-## )<textarea data-k="specB" rows="6">${esc(S.specB)}</textarea></label><label>מפרט הדירות (שורה לכל פריט, כותרת משנה בשורה שמתחילה ב-## )<textarea data-k="specA" rows="8">${esc(S.specA)}</textarea></label><label><input type="checkbox" id="pl" ${S.pills?'checked':''}> הצגת באנר "דירות פנויות" בראש הדף</label><label><input type="checkbox" id="ss" ${S.showStatus?'checked':''}> הצגת סטטוס "פנויה / נמכרה" בטבלאות</label><label>קישור לשיתוף (הקישור הציבורי של הדף)<input data-k="link" value="${esc(S.link||'')}"></label><label>מספר וואטסאפ (בפורמט 9725XXXXXXXX)<input data-k="wa" value="${esc(S.wa)}"></label><label>הוספת הדמיות (עד 4)<input type="file" accept="image/*" multiple id="fi"></label><label><input type="checkbox" id="cl"> מחיקת ההדמיות הקיימות (${S.imgs.length})</label>`,
  ()=>{document.querySelectorAll('#ov [data-k]').forEach(e=>S[e.dataset.k]=e.value.trim());S.wa=S.wa.replace(/\D/g,'');S.pills=$('#pl').checked;S.showStatus=$('#ss').checked;if($('#cl').checked)S.imgs=[];S.imgs=S.imgs.concat(add).slice(0,4)});
  $('#fi').onchange=e=>{add=[];[...e.target.files].slice(0,4).forEach(f=>shrink(f,d=>add.push(d)))}}
async function pub(){
  try{const a=await claude.use('artifact');const d=document.documentElement.cloneNode(true);
  d.querySelector('#app').innerHTML='';const o=d.querySelector('#ov');o.innerHTML='';o.hidden=true;
  d.querySelector('#st').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  await a.publish('<!doctype html>'+d.outerHTML)}catch(e){alert('הפרסום נכשל, נסו שוב')}}
document.addEventListener('click',e=>{const t=e.target;
  if(t.classList.contains('ed'))editA(+t.dataset.i);else if(t.classList.contains('zm')){const o=$('#ov');let z=1;o.innerHTML=`<div class="lv"><div class="lt"><button id="zi">＋</button><button id="zo">－</button><button id="cz">סגירה</button></div><div class="ls"><img id="zimg" src="${t.dataset.src||t.src}"></div></div>`;o.hidden=false;const im=$('#zimg'),ap=()=>{im.style.width=(z*100)+'%';im.style.maxHeight=z>1?'none':'100%'};$('#zi').onclick=()=>{z=Math.min(4,z+.75);ap()};$('#zo').onclick=()=>{z=Math.max(1,z-.75);ap()};im.onclick=()=>{z=z>1?1:2.5;ap()};$('#cz').onclick=()=>o.hidden=true}else if(t.id==='eb')editB();else if(t.id==='pb')pub()});
const vl=(c,t)=>{const p=$('#vp');if(p){p.hidden=c;if(t)p.querySelector('span').textContent=t}};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#vp');const v=$('#vv');
  if(b&&v){if(v.ended)v.currentTime=0;v.play()}else if(e.target.id==='vv')v.paused?v.play():v.pause()});
document.addEventListener('play',e=>{if(e.target.id==='vv')vl(true)},true);
document.addEventListener('pause',e=>{if(e.target.id==='vv')vl(false,'המשיכו לצפות')},true);
document.addEventListener('ended',e=>{if(e.target.id==='vv')vl(false,'הפעלה חוזרת')},true);
render();

</script>
